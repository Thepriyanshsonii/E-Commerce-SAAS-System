# ============================================================
# docker-compose.yml — Local development override
# Run: docker compose up
#
# For QA/PROD on cloud servers, use docker-compose.qa.yml or
# docker-compose.prod.yml, or pass --env-file explicitly:
#   docker compose --env-file .env.qa up -d
# ============================================================

version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-backend:dev
    container_name: ecommerce_backend_dev
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./backend/.env          # ← developer creates this from .env.example
    environment:
      - APP_ENV=development
      - FLASK_ENV=development
    volumes:
      # Mount source for hot-reload during dev (remove in prod)
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-5000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
