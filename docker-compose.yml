version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ecommerce_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000" # Expose to localhost only, proxied by host Nginx
    env_file:
      - .env
    environment:
      - PORT=5000
      - FLASK_ENV=production
    volumes:
      # Bind mounts to allow host-level Nginx to serve static files directly
      - /home/ubuntu/uploads:/app/backend/static/uploads
      - /home/ubuntu/reports:/app/backend/utils/reports
    mem_limit: 500m
    mem_reservation: 200m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
