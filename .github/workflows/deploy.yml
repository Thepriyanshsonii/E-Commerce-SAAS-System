name: Production CI/CD Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'nginx.conf'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    name: Build & Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          command_timeout: 15m
          script: |
            echo "=== Starting SSH Deployment ==="
            cd ~/E-Commerce
            
            # Reset local changes and pull latest
            git reset --hard HEAD
            git pull origin main

            # Verify that .env exists (must be seeded manually first)
            if [ ! -f .env ]; then
              echo "[ERROR] .env file is missing on VPS! Deployment aborted."
              exit 1
            fi

            # Build first (in background - zero downtime during build)
            echo "=== Building Backend Image ==="
            docker compose build backend

            # Recreate running container instantly (fraction of a second swap)
            echo "=== Swapping Container ==="
            docker compose up -d --no-deps backend

            # Clean up dangling images to save disk space on 1GB VPS
            docker image prune -f

            # Verify deployment health status
            echo "=== Verifying Health Checks ==="
            max_attempts=10
            attempt=1
            healthy=false

            while [ $attempt -le $max_attempts ]; do
              # Query the local backend port directly
              response=$(curl -s -w "%{http_code}" -o /dev/null http://localhost:5000/api/health)
              if [ "$response" = "200" ]; then
                echo "[SUCCESS] Application is healthy and responding!"
                healthy=true
                break
              else
                echo "[WAIT] Attempt $attempt/$max_attempts: Backend returned code $response. Retrying in 5s..."
                sleep 5
                attempt=$((attempt+1))
              fi
            done

            if [ "$healthy" = "false" ]; then
              echo "[ERROR] Health check failed! Showing docker logs:"
              docker compose logs backend
              exit 1
            fi
            
            echo "=== Deployment Successfully Finalized! ==="
