# ==========================================
# SSJewellery E-Commerce Nginx Host Configuration
# Place this at: /etc/nginx/sites-available/ecommerce
# ==========================================

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Client limits (e.g. for catalog image uploads)
    client_max_body_size 20M;

    # Serve static file uploads directly through Nginx (highly optimized)
    location /static/uploads/ {
        alias /home/ubuntu/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Serve monthly reports directly through Nginx (protected via auth in app if needed, but optimized)
    location /static/reports/ {
        alias /home/ubuntu/reports/;
        expires 1d;
        add_header Cache-Control "private, no-transform";
        access_log off;
    }

    # Healthcheck location (do not pollute log files)
    location /api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Route all other API requests to the Flask container running on port 5000
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }
}
